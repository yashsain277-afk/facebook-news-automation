name: सियासत - Daily Indian Politics

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *" # 9:00 AM IST

# Prevent two Siyasat runs from updating the posted-story file at the same time.
concurrency:
  group: siyast-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-siyast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra
      - name: Install packages
        run: pip install feedparser Pillow requests
      - name: Post political update
        env:
          FB_PAGE_ID: "128228341017942"
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.SIYASAT_PAGE_ACCESS_TOKEN }}
        run: python siyast_content.py
      - name: Save posted story
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add siyast_posted.json
          git diff --cached --quiet || git commit -m "Update Siyasat posted stories"

          # Another workflow may have pushed to main while this job was running.
          # Rebase onto the latest remote commit and retry the push.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort
              echo "Rebase conflict; retrying after refreshing main..."
              sleep 5
              continue
            }

            if git push origin HEAD:main; then
              echo "Siyasat state pushed successfully."
              exit 0
            fi

            echo "Push race detected; retrying..."
            sleep 5
          done

          echo "Could not push Siyasat state after 5 attempts."
          exit 1
