name: सियासत - Daily Indian Politics

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *" # 9:00 AM IST

permissions:
  contents: write

jobs:
  post-siyast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install feedparser Pillow requests
      - name: Post political update
        env:
          FB_PAGE_ID: "128228341017942"
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.SIYASAT_PAGE_ACCESS_TOKEN }}
        run: python siyast_content.py
      - name: Save posted story
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add siyast_posted.json
          git diff --cached --quiet || git commit -m "Update Siyasat posted stories"
          git push
