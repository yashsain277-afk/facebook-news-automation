name: Vee News - Faceless Cricket Video Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  faceless-cricket-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fonts-dejavu
          pip install Pillow feedparser gTTS

      - name: Create faceless cricket video
        run: python vee_cricket_video.py

      - name: Check generated video
        run: |
          test -s vee_cricket_faceless.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 vee_cricket_faceless.mp4

      - name: Upload video and debug files
        uses: actions/upload-artifact@v4
        with:
          name: vee-cricket-faceless-video
          path: |
            vee_cricket_faceless.mp4
            vee_cricket_video_work/frame*.jpg
            vee_cricket_video_work/script.txt
          retention-days: 7
