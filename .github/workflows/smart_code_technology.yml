name: Smart Code Technology - Daily Tech Post

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *" # 10:00 AM IST

permissions:
  contents: write

jobs:
  post-tech:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install feedparser Pillow
      - name: Post latest technology
        env:
          FB_PAGE_ID: "207734556102633"
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.SMART_CODE_PAGE_ACCESS_TOKEN }}
        run: python smart_code_technology.py
      - name: Save posted technology
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart_code_posted.json
          git diff --cached --quiet || git commit -m "Update Smart Code Technology posted news"
          git push
