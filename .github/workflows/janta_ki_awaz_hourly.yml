name: Janta Ki Awaz - Local News Every Hour

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

concurrency:
  group: janta-ki-awaz-hourly
  cancel-in-progress: false

jobs:
  post-local-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra

      - name: Install packages
        run: pip install Pillow feedparser

      - name: Post one new local story
        env:
          JANTA_KI_AWAZ_PAGE_ID: ${{ secrets.JANTA_KI_AWAZ_PAGE_ID }}
          JANTA_KI_AWAZ_PAGE_ACCESS_TOKEN: ${{ secrets.JANTA_KI_AWAZ_PAGE_ACCESS_TOKEN }}
        run: python janta_ki_awaz_news.py

      - name: Save Janta post history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add janta_ki_awaz_posted.json
          git diff --cached --quiet || git commit -m "Update Janta Ki Awaz local news history"
          git push
