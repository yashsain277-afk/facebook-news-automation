name: Auto News Post

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  post-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hindi font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

      - name: Install Pillow
        run: pip install Pillow

      - name: Collect news
        run: python news_collector.py

      - name: Post to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python facebook_test.py

      - name: Save posted news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted_news.json
          git diff --cached --quiet || git commit -m "Update posted news"
          git push
